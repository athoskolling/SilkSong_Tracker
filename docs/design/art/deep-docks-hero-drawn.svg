<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMax slice" role="img" aria-labelledby="dd-t dd-d">
<title id="dd-t">Deep Docks</title>
<desc id="dd-d">A dockside forge district at dusk: crooked chimneys, a glowing furnace, a big bronze bell on an iron gantry, and embers drifting over dark water.</desc>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#130B13"/>
    <stop offset=".32" stop-color="#2b0f1d"/>
    <stop offset=".6" stop-color="#5c1d1a"/>
    <stop offset=".82" stop-color="#b8471f"/>
    <stop offset="1" stop-color="#f08a3c"/>
  </linearGradient>
  <radialGradient id="glow" cx="1060" cy="570" r="560" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ff7a3d" stop-opacity=".85"/>
    <stop offset=".45" stop-color="#d9442a" stop-opacity=".28"/>
    <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mouth" cx=".5" cy=".85" r=".85">
    <stop offset="0" stop-color="#fff2b0"/>
    <stop offset=".35" stop-color="#ffb347"/>
    <stop offset=".7" stop-color="#ff6a2c"/>
    <stop offset="1" stop-color="#b8281a"/>
  </radialGradient>
  <linearGradient id="bell" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7a4a1e"/>
    <stop offset=".35" stop-color="#e7b45c"/>
    <stop offset=".5" stop-color="#f6d58a"/>
    <stop offset=".75" stop-color="#c98a35"/>
    <stop offset="1" stop-color="#6e3f18"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5c2418"/>
    <stop offset=".3" stop-color="#2a1220"/>
    <stop offset="1" stop-color="#0e070e"/>
  </linearGradient>
  <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffb35a" stop-opacity=".6"/>
    <stop offset="1" stop-color="#ffb35a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="vTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#130B13" stop-opacity=".85"/>
    <stop offset="1" stop-color="#130B13" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vLeft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#130B13" stop-opacity=".75"/>
    <stop offset="1" stop-color="#130B13" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vBottom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#130B13" stop-opacity="0"/>
    <stop offset="1" stop-color="#130B13" stop-opacity=".7"/>
  </linearGradient>
  <pattern id="lattice" width="40" height="80" patternUnits="userSpaceOnUse" patternTransform="translate(1368 96)">
    <path d="M0 0 L40 80 M40 0 L0 80" stroke="#3a1f2c" stroke-width="5" fill="none"/>
  </pattern>
  <g id="star">
    <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z" fill="#ffd08a"/>
  </g>
</defs>

