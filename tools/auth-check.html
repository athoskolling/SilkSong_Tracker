<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth check (developer page, not part of the site)</title>
</head>
<body>
  <h1>Auth check</h1>
  <p>Developer page for trying sign-in by hand. It does not read or write Firestore.</p>

  <p><strong>Current user:</strong> <span id="user">waiting for the sign-in service...</span></p>
  <p><strong>Last message:</strong> <span id="message"></span></p>

  <p>
    <button id="google" type="button">Sign in with Google</button>
    <button id="github" type="button">Sign in with GitHub (not enabled yet, should show an error)</button>
  </p>

  <p>
    <label>Email <input id="email" type="email" autocomplete="email"></label>
    <button id="email-link" type="button">Send sign-in link</button>
  </p>

  <p id="needs-email" hidden>
    This link was opened on a device that does not remember the address. Type it in the email field above, then:
    <button id="finish-email" type="button">Finish sign-in</button>
  </p>

  <p><button id="sign-out" type="button">Sign out</button></p>

  <script type="module">
    import {
      signIn,
      completeEmailLinkSignIn,
      signOut,
      onAuthChange,
    } from '../js/firebase.js';

    const userLine = document.getElementById('user');
    const messageLine = document.getElementById('message');
    const emailField = document.getElementById('email');
    const needsEmail = document.getElementById('needs-email');

    function say(text) {
      messageLine.textContent = text;
    }

    async function run(label, action) {
      say(label + '...');
      try {
        await action();
        say(label + ': done');
      } catch (error) {
        say(label + ' failed: ' + error.message + (error.code ? ' [' + error.code + ']' : ''));
      }
    }

    onAuthChange((user) => {
      userLine.textContent = user
        ? 'uid ' + user.uid + ' | email ' + (user.email || '(none)') + ' | provider ' + user.provider
        : 'signed out';
    });

    document.getElementById('google').addEventListener('click', () => run('Google sign-in', () => signIn('google')));
    document.getElementById('github').addEventListener('click', () => run('GitHub sign-in', () => signIn('github')));
    document.getElementById('email-link').addEventListener('click', () =>
      run('Send link', async () => {
        await signIn('email-link', emailField.value);
        say('Link sent. Open it in this browser (or another, then type the address when asked).');
      })
    );
    document.getElementById('sign-out').addEventListener('click', () => run('Sign out', signOut));

    async function finishEmailLink(address) {
      const result = await completeEmailLinkSignIn(address);
      needsEmail.hidden = result !== 'needs-email';
      if (result === 'signed-in') say('Signed in with the email link.');
      if (result === 'needs-email') say('Type your email address and press Finish sign-in.');
    }

    document.getElementById('finish-email').addEventListener('click', () =>
      run('Finish sign-in', () => finishEmailLink(emailField.value))
    );

    // main.js does this on every page load; this page does the same.
    run('Check for an email link', () => finishEmailLink());
  </script>
</body>
</html>
