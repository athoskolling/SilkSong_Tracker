<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silksong guide</title>

  <!-- Fonts: Google Fonts with display=swap (decision recorded in the task handoff).
       Until they load, or if they never do, the system fallbacks in css/base.css are used. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#app">Skip to the content</a>

  <!-- Shown only with ?data=sample (js/main.js). -->
  <div class="banner" id="banner" hidden>Sample data. Not guide content.</div>

  <div class="page">
    <header class="site-header">
      <div class="frame">
        <a class="logo" href="index.html">
          <svg class="logo-mark" viewBox="0 0 30 18" aria-hidden="true">
            <path class="line" d="M3 9 H29"/>
            <ellipse class="eye" cx="4.5" cy="9" rx="2.3" ry="3.6"/>
          </svg>
          Silksong guide
        </a>
        <nav class="site-nav" aria-label="Main">
          <a href="index.html" aria-current="page">Regions</a>
          <!-- "Route" returns when route.html exists (Phase 2). Until then the link would lead to a 404. -->
          <a href="account.html">Account and backup</a>
        </nav>
      </div>
    </header>

    <main id="app" tabindex="-1">
      <!-- TEMPORARY until Home is built in Phase 2. js/main.js reads data/regions.json, takes the
           Region with the lowest `order` and sends the visitor to its page. The link below is the
           way in when JavaScript is off or the redirect has not happened yet; main.js points it at
           the first Region too. The address written here is only the fallback for the no-JavaScript
           case (ids are permanent, ADR 0003, so it cannot break; it can only stop being the first). -->
      <div class="frame main-plain">
        <div class="plate message">
          <h1 class="plate-heading">Silksong guide</h1>
          <p class="plate-text">Follow the route, mark what you finish and see what is missing.</p>
          <p class="plate-text"><a id="open-guide" href="region.html?id=moss-grotto">Open the guide</a></p>
          <noscript>
            <p class="plate-text">The guide needs JavaScript. Turn it on in your browser and reload this page.</p>
          </noscript>
        </div>
      </div>
    </main>

    <footer class="frame site-footer">
      <p id="credit" hidden></p>
      <p id="sync-status" role="status"></p>
    </footer>
  </div>

  <!-- One polite live region for "Marked as done" style announcements (DESIGN.md section 8). -->
  <div id="announcer" class="visually-hidden" aria-live="polite" role="status"></div>
</body>
</html>
